name: CI

on:
  push:
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm ci
        working-directory: Frontend
      - run: npm run build
        working-directory: Frontend
      - run: npm run test
        working-directory: Frontend
      - run: npm run lint
        working-directory: Frontend

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: planix_test
          POSTGRES_USER: planix
          POSTGRES_PASSWORD: planix
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U planix -d planix_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://planix:planix@127.0.0.1:5432/planix_test
      PLANIX_TEST_DATABASE: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - run: python -m alembic upgrade head
        working-directory: Backend
      - run: python -m compileall backend
        working-directory: Backend
      - run: python -m pytest backend/tests
        working-directory: Backend

  desktop-config:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check desktop scaffold
        shell: pwsh
        run: .\scripts\check-desktop-config.ps1
