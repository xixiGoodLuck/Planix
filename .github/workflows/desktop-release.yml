name: Desktop Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the leading v"
        required: true
        default: "1.1.4"
      run_real_deepseek_preflight:
        description: "Run the secrets-enabled DeepSeek provider preflight"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  deepseek-preflight:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_real_deepseek_preflight }}
    runs-on: windows-latest
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      USE_REAL_LLM: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Require release secret without printing it
        shell: pwsh
        run: if (-not $env:DEEPSEEK_API_KEY) { throw 'DEEPSEEK_API_KEY release secret is unavailable' }
      - run: python -m pip install -r requirements.txt
      - name: Real DeepSeek provider preflight
        shell: pwsh
        run: .\scripts\test-deepseek-real.ps1

  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: dtolnay/rust-toolchain@stable

      - name: Resolve release version
        shell: pwsh
        run: |
          $Version = "${{ github.event.inputs.version }}"
          if (-not $Version) {
            $Version = "${{ github.ref_name }}".TrimStart("v")
          }
          "RELEASE_VERSION=$Version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build Windows installer
        shell: pwsh
        run: .\scripts\build-release.ps1 -Version $env:RELEASE_VERSION

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Planix-v${{ env.RELEASE_VERSION }}-windows-x64-installers
          path: release/*

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.RELEASE_VERSION }}
          name: Planix v${{ env.RELEASE_VERSION }}
          body_path: docs/release-v1.1.4.md
          files: release/*
