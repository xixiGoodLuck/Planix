services:
  postgres:
    image: postgres:17-alpine
    environment:
      # Local development only; replace these values outside local development.
      POSTGRES_DB: planix
      POSTGRES_USER: planix
      POSTGRES_PASSWORD: planix
    ports:
      - "5432:5432"
    volumes:
      - planix-postgres:/var/lib/postgresql/data
      - ./scripts/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planix -d planix"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  planix-postgres:
